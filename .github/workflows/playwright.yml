name: Playwright Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Run against a deployed environment (e.g. staging URL). Leave empty for local app.'
        required: false
  schedule:
    - cron: '0 13 * * *' # daily run, catches issues that are not tied to a code change

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run typecheck

  test:
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [api, chromium, firefox, webkit, mobile-chrome, mobile-safari]
    env:
      BASE_URL: ${{ github.event.inputs.base_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Install browsers
        if: matrix.project != 'api'
        run: npx playwright install --with-deps
      - name: Run ${{ matrix.project }} tests
        run: npx playwright test --project=${{ matrix.project }}
      - name: Upload report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
